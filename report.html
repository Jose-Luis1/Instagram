<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento de vuelta</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>¿Quién no te sigue de vuelta?</h1><p>Abre Instagram e inicia sesión. Esta extensión lee tus listas para compararlas; no deja de seguir cuentas ni guarda tu contraseña.</p><p>Los resultados permanecen en esta pestaña y se borran al cerrarla. Instagram puede limitar o impedir el acceso a las listas.</p><label for="account">Pestaña de Instagram</label><select id="account"></select><button id="refresh">Actualizar pestañas</button><button id="scan">Comparar mis listas</button><p id="status" role="status" aria-live="polite"></p><p id="summary"></p><label for="search">Filtrar por usuario</label><input id="search" type="search" placeholder="Nombre de usuario"><ul id="results"></ul></main><script type="module" src="report.js"></script></body>
</html>
